<svg viewBox="0 0 600 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ilustración de plato de comida Pedzio">
  <rect width="600" height="500" fill="#FDEDE3"/>
  <circle cx="300" cy="250" r="190" fill="#FFFFFF"/>
  <circle cx="300" cy="250" r="190" fill="none" stroke="#F1D9C9" stroke-width="10"/>

  <!-- Plato -->
  <ellipse cx="300" cy="290" rx="150" ry="60" fill="#EFE6DC"/>
  <ellipse cx="300" cy="280" rx="150" ry="60" fill="#FFFFFF" stroke="#E7E9EC" stroke-width="2"/>

  <!-- Empanadas (formas abstractas tipo medialuna) -->
  <path d="M170 270 Q210 220 260 260 Q225 300 170 270 Z" fill="#E85D2C"/>
  <path d="M170 270 Q210 220 260 260 Q225 300 170 270 Z" fill="none" stroke="#C9491F" stroke-width="3"/>

  <path d="M270 235 Q320 190 375 230 Q335 275 270 235 Z" fill="#F2884A"/>
  <path d="M270 235 Q320 190 375 230 Q335 275 270 235 Z" fill="none" stroke="#C9491F" stroke-width="3"/>

  <path d="M330 275 Q385 240 430 280 Q390 315 330 275 Z" fill="#E85D2C"/>
  <path d="M330 275 Q385 240 430 280 Q390 315 330 275 Z" fill="none" stroke="#C9491F" stroke-width="3"/>

  <!-- Guarnición -->
  <circle cx="230" cy="300" r="18" fill="#6FA85E"/>
  <circle cx="380" cy="310" r="14" fill="#6FA85E"/>
  <circle cx="300" cy="320" r="10" fill="#F2C14E"/>

  <!-- Salsa -->
  <circle cx="180" cy="330" r="22" fill="#16213E"/>
  <circle cx="180" cy="330" r="22" fill="none" stroke="#0F1730" stroke-width="2"/>

  <!-- Puntada decorativa -->
  <path d="M110 130 Q150 110 190 130" fill="none" stroke="#E85D2C" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 10"/>
  <path d="M410 130 Q450 110 490 130" fill="none" stroke="#E85D2C" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 10"/>
</svg>
